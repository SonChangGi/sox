name: Deploy static SOX dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:30 KST Tue-Sat: SOX latest-date collection after the prior U.S. regular session.
    - cron: "30 22 * * 1-5"
    # 09:30/11:30/13:30 KST Tue-Sat: 2-hour retries when providers lag or the primary run fails.
    - cron: "30 0 * * 2-6"
    - cron: "30 2 * * 2-6"
    - cron: "30 4 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      should_collect: ${{ steps.freshness.outputs.should_collect }}
      should_deploy: ${{ steps.freshness.outputs.should_deploy }}
      freshness_reason: ${{ steps.freshness.outputs.freshness_reason }}
      expected_data_as_of: ${{ steps.freshness.outputs.expected_data_as_of }}
      actual_data_as_of: ${{ steps.freshness.outputs.actual_data_as_of }}
    steps:
      - name: Require the production branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "SOX production refreshes must run from ${DEFAULT_BRANCH}; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Decide whether SOX collection is needed
        id: freshness
        run: |
          python3 scripts/check_sox_freshness.py --event-name "${{ github.event_name }}" | tee /tmp/sox-freshness.env
          cat /tmp/sox-freshness.env >> "$GITHUB_OUTPUT"
  build:
    needs: freshness
    if: needs.freshness.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      analysis_sha256: ${{ steps.public_contract.outputs.analysis_sha256 }}
      history_sha256: ${{ steps.public_contract.outputs.history_sha256 }}
      summary_sha256: ${{ steps.public_contract.outputs.summary_sha256 }}
      source_sha: ${{ steps.public_contract.outputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Refresh generated SOX data
        if: needs.freshness.outputs.should_collect == 'true'
        env:
          STRICT_REFRESH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '30 4 * * 2-6' }}
        run: |
          if [[ "$STRICT_REFRESH" == "true" ]]; then
            python3 scripts/fetch_sox_data.py --fail-on-degraded
          else
            # Preserve and publish explicit degraded diagnostics while providers
            # recover; the final scheduled retry is strict and fails loudly.
            python3 scripts/fetch_sox_data.py --offline-ok --allow-degraded
          fi
      - name: Verify static dashboard
        run: npm test
      - name: Commit generated SOX data
        if: needs.freshness.outputs.should_collect == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          base_sha="$(git rev-parse HEAD)"
          branch="${GITHUB_REF_NAME:-main}"
          git fetch origin "$branch:refs/remotes/origin/$branch"
          remote_sha="$(git rev-parse "origin/$branch")"
          if [[ "$remote_sha" != "$base_sha" ]]; then
            echo "The target branch changed after SOX collection; rerun from remote ${remote_sha}." >&2
            exit 1
          fi
          if git diff --quiet -- data/sox-analysis.json data/sox-history.json data/summary.json; then
            echo "No generated SOX data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sox-analysis.json data/sox-history.json data/summary.json
          cat > /tmp/sox-data-commit-message <<'EOF'
          Preserve SOX snapshots for date-selectable static research

          Constraint: GitHub Pages serves generated JSON only; live public-source access stays in the refresh workflow.
          Confidence: high
          Scope-risk: narrow
          Directive: Keep sox-history.json append/replace-by-dataAsOf so users can inspect stored dates without browser-side finance calls.
          Tested: npm test
          Not-tested: Provider completeness beyond public Nasdaq/Yahoo endpoints.
          EOF
          git commit -F /tmp/sox-data-commit-message
          git fetch origin "$branch:refs/remotes/origin/$branch"
          remote_sha="$(git rev-parse "origin/$branch")"
          if [[ "$remote_sha" != "$base_sha" ]]; then
            echo "The target branch changed after SOX collection; refusing to mix old-code output with the new source revision." >&2
            echo "Rerun collection from remote ${remote_sha}." >&2
            exit 1
          fi
          git push origin "HEAD:$branch"
      - name: Record exact public data contract
        id: public_contract
        shell: bash
        run: |
          echo "analysis_sha256=$(sha256sum data/sox-analysis.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "history_sha256=$(sha256sum data/sox-history.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "summary_sha256=$(sha256sum data/summary.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [freshness, build]
    if: needs.freshness.outputs.should_deploy == 'true'
    steps:
      - name: Check out the current production revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Require the uploaded artifact source to remain current
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "SOX main advanced after artifact construction; refusing to deploy a stale artifact." >&2
            exit 1
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live public data bytes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_ANALYSIS_SHA256: ${{ needs.build.outputs.analysis_sha256 }}
          EXPECTED_HISTORY_SHA256: ${{ needs.build.outputs.history_sha256 }}
          EXPECTED_SUMMARY_SHA256: ${{ needs.build.outputs.summary_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            matched=true
            for contract in \
              "data/sox-analysis.json:$EXPECTED_ANALYSIS_SHA256" \
              "data/sox-history.json:$EXPECTED_HISTORY_SHA256" \
              "data/summary.json:$EXPECTED_SUMMARY_SHA256"; do
              relative_path="${contract%%:*}"
              expected_sha256="${contract#*:}"
              readback="/tmp/sox-${relative_path//\//-}"
              if ! curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --output "$readback" \
                "${PAGE_URL%/}/${relative_path}?run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
                || [[ "$(sha256sum "$readback" | cut -d ' ' -f1)" != "$expected_sha256" ]]; then
                matched=false
                break
              fi
            done
            if [[ "$matched" == "true" ]]; then
              echo "Live SOX data is byte-identical to the uploaded Pages artifact."
              exit 0
            fi
            [[ $attempt -lt 12 ]] || exit 1
            sleep 5
          done
