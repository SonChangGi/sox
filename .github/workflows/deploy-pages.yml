name: Deploy static SOX dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # KST Tue-Sat: 06:43 primary, 10:13 and 13:43 bounded recovery.
    - cron: "43 21 * * 1-5"
    - cron: "13 1 * * 2-6"
    - cron: "43 4 * * 2-6"

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  admission:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Wait for earlier peer data pipelines
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/automation_admission.py

  freshness:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_collect: ${{ steps.freshness.outputs.should_collect }}
      should_deploy: ${{ steps.delivery.outputs.should_deploy }}
      freshness_reason: ${{ steps.freshness.outputs.freshness_reason }}
      expected_data_as_of: ${{ steps.freshness.outputs.expected_data_as_of }}
      actual_data_as_of: ${{ steps.freshness.outputs.actual_data_as_of }}
      source_sha: ${{ steps.freshness.outputs.source_sha }}
      delivery_reason: ${{ steps.delivery.outputs.delivery_reason }}
    steps:
      - name: Require the production branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "SOX production refreshes must run from ${DEFAULT_BRANCH}; received ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Decide whether SOX collection is needed
        id: freshness
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/check_sox_freshness.py --event-name "$EVENT_NAME" | tee "$RUNNER_TEMP/sox-freshness.env"
          cat "$RUNNER_TEMP/sox-freshness.env" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Recover an unpublished or mismatched current snapshot
        id: delivery
        env:
          SHOULD_DEPLOY: ${{ steps.freshness.outputs.should_deploy }}
        run: |
          should_deploy="$SHOULD_DEPLOY"
          reason=collection_or_push
          if [[ "$should_deploy" == "false" ]]; then
            if python3 scripts/verify_publication.py --attempts 1; then
              reason=current_data_already_published
            else
              should_deploy=true
              reason=current_data_requires_publication_repair
            fi
          fi
          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"
          echo "delivery_reason=$reason" >> "$GITHUB_OUTPUT"

  build:
    needs: freshness
    if: needs.freshness.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.public_contract.outputs.source_sha }}
      refresh_outcome: ${{ steps.refresh.outcome }}
      verification_outcome: ${{ steps.static_verify.outcome }}
      collected_data_status: ${{ steps.static_verify.outputs.status_level }}
      collected_data_as_of: ${{ steps.static_verify.outputs.actual_data_as_of }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.freshness.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'
      - name: Collect and verify a current candidate before promotion
        id: refresh
        if: needs.freshness.outputs.should_collect == 'true'
        env:
          EXPECTED_DATA_AS_OF: ${{ needs.freshness.outputs.expected_data_as_of }}
        run: python3 scripts/refresh_sox_pipeline.py --attempts 3 --retry-delay 30 --expected-data-as-of "$EXPECTED_DATA_AS_OF"
      - name: Verify static dashboard and require current publication
        id: static_verify
        shell: bash
        env:
          SHOULD_COLLECT: ${{ needs.freshness.outputs.should_collect }}
        run: |
          set -euo pipefail
          # The collector pipeline already ran the full suite on its candidate.
          if [[ "$SHOULD_COLLECT" != "true" ]]; then
            npm test
          fi
          python3 scripts/check_sox_freshness.py --event-name schedule --require-fresh | tee "$RUNNER_TEMP/sox-verified.env"
          cat "$RUNNER_TEMP/sox-verified.env" >> "$GITHUB_OUTPUT"
      - name: Commit generated SOX data
        if: needs.freshness.outputs.should_collect == 'true'
        run: |
          base_sha="$(git rev-parse HEAD)"
          branch="${GITHUB_REF_NAME:-main}"
          git fetch origin "$branch:refs/remotes/origin/$branch"
          remote_sha="$(git rev-parse "origin/$branch")"
          if [[ "$remote_sha" != "$base_sha" ]]; then
            echo "The target branch changed after SOX collection; rerun from remote ${remote_sha}." >&2
            exit 1
          fi
          if git diff --quiet -- data/sox-analysis.json data/sox-history.json data/summary.json; then
            echo "No generated SOX data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sox-analysis.json data/sox-history.json data/summary.json
          git commit -m "Refresh verified current SOX snapshot"
          git fetch origin "$branch:refs/remotes/origin/$branch"
          remote_sha="$(git rev-parse "origin/$branch")"
          if [[ "$remote_sha" != "$base_sha" ]]; then
            echo "The target branch changed; refusing to mix old-code output with new source." >&2
            exit 1
          fi
          git push origin "HEAD:$branch"
      - name: Record exact public data contract
        id: public_contract
        run: echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Assemble the verified public site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [freshness, build]
    outputs:
      deployment_outcome: ${{ steps.deployment.outcome }}
      readback_outcome: ${{ steps.public_readback.outcome }}
    if: needs.freshness.outputs.should_deploy == 'true'
    steps:
      - name: Check out the current production revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Require the uploaded artifact source to remain current
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "SOX main advanced after artifact construction; refusing to deploy a stale artifact." >&2
            exit 1
          fi
          python3 scripts/check_sox_freshness.py --event-name schedule --require-fresh
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify live public data bytes and freshness
        id: public_readback
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/verify_publication.py --base-url "$PAGE_URL" --attempts 6 --retry-delay 5 --report "$RUNNER_TEMP/sox-public-verification.json"

  public-site-health:
    needs: [freshness, build, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Report collection and delivery outcomes separately
        env:
          PREFLIGHT: ${{ needs.freshness.result }}
          BUILD: ${{ needs.build.result }}
          DEPLOY_JOB: ${{ needs.deploy.result }}
          SHOULD_DEPLOY: ${{ needs.freshness.outputs.should_deploy }}
          DELIVERY_REASON: ${{ needs.freshness.outputs.delivery_reason }}
          EXPECTED_DATE: ${{ needs.freshness.outputs.expected_data_as_of }}
          STORED_DATE: ${{ needs.freshness.outputs.actual_data_as_of }}
          REFRESH: ${{ needs.build.outputs.refresh_outcome }}
          VERIFICATION: ${{ needs.build.outputs.verification_outcome }}
          DEPLOYMENT: ${{ needs.deploy.outputs.deployment_outcome }}
          READBACK: ${{ needs.deploy.outputs.readback_outcome }}
          DATA_STATUS: ${{ needs.build.outputs.collected_data_status }}
          DATA_DATE: ${{ needs.build.outputs.collected_data_as_of }}
        run: |
          {
            echo '## SOX collection and delivery'
            echo '| Check | Outcome |'
            echo '| --- | --- |'
            printf '| Freshness preflight | %s |\n' "$PREFLIGHT"
            printf '| Collection and candidate tests | %s |\n' "${REFRESH:-not_run}"
            printf '| Current publication gate | %s |\n' "${VERIFICATION:-not_run}"
            printf '| Data status and date | %s / %s |\n' "${DATA_STATUS:-not_run}" "${DATA_DATE:-$STORED_DATE}"
            printf '| Pages deployment | %s |\n' "${DEPLOYMENT:-not_run}"
            printf '| Published bytes and freshness | %s |\n' "${READBACK:-$DELIVERY_REASON}"
            printf '\nExpected session: %s. Delivery decision: %s.\n' "$EXPECTED_DATE" "$DELIVERY_REASON"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PREFLIGHT" != "success" ]]; then
            echo "::error::SOX freshness preflight failed."
            exit 1
          fi
          if [[ "$SHOULD_DEPLOY" == "false" && "$DELIVERY_REASON" == "current_data_already_published" ]]; then
            echo "Current healthy data and all public files already match; no new collection or deployment needed."
          elif [[ "$SHOULD_DEPLOY" == "true" && "$BUILD" == "success" && "$DEPLOY_JOB" == "success" && "$VERIFICATION" == "success" && "$READBACK" == "success" ]]; then
            echo "SOX current data, validation, deployment, and public readback all succeeded."
          else
            echo "::error::SOX collection or delivery is incomplete. Existing page availability does not establish freshness."
            exit 1
          fi
