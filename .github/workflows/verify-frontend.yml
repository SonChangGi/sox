name: Verify additional SOX frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'assets/shared-nav.css'
      - 'assets/styles.css'
      - 'data/**'
      - '.github/workflows/verify-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'assets/shared-nav.css'
      - 'assets/styles.css'
      - 'data/**'
      - '.github/workflows/verify-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run verify --prefix frontend
